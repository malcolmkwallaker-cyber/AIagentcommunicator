name: Agent - steadfast
on:
  schedule:
    - cron: "30 8 * * 1-5"   # change this line to change the schedule
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pause-check:
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.c.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          if [ -f PAUSE ]; then echo "paused=true" >> "$GITHUB_OUTPUT"; else echo "paused=false" >> "$GITHUB_OUTPUT"; fi
  run:
    needs: pause-check
    if: needs.pause-check.outputs.paused != 'true'
    uses: ./.github/workflows/run-agent.yml
    with:
      agent: steadfast
      max_turns: "25"
      timeout_minutes: 20
    secrets: inherit
